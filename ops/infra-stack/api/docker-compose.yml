services:
  api:
    image: ${APP_IMAGE_DIGEST_REF:?set APP_IMAGE_DIGEST_REF}
    restart: unless-stopped
    user: "65532:65532"
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_TIMEZONE: ${APP_TIMEZONE}
      HTTP_ADDRESS: 0.0.0.0:8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN}
      API_ORIGIN: ${API_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
      SESSION_STORE: database
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_COOKIE_SECURE: "true"
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT}
      SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER}
      CSRF_TOKEN_PEPPER: ${CSRF_TOKEN_PEPPER}
      AUTH_ATTEMPT_FINGERPRINT_KEY: ${AUTH_ATTEMPT_FINGERPRINT_KEY}
      TOTP_ACTIVE_KEY_VERSION: ${TOTP_ACTIVE_KEY_VERSION}
      TOTP_ENCRYPTION_KEYS: ${TOTP_ENCRYPTION_KEYS}
      RECOVERY_TOKEN_ACTIVE_KEY_VERSION: ${RECOVERY_TOKEN_ACTIVE_KEY_VERSION}
      RECOVERY_TOKEN_HMAC_KEYS: ${RECOVERY_TOKEN_HMAC_KEYS}
      RECOVERY_DELIVERY_ACTIVE_KEY_VERSION: ${RECOVERY_DELIVERY_ACTIVE_KEY_VERSION}
      RECOVERY_DELIVERY_ENCRYPTION_KEYS: ${RECOVERY_DELIVERY_ENCRYPTION_KEYS}
      RECOVERY_CODE_ACTIVE_KEY_VERSION: ${RECOVERY_CODE_ACTIVE_KEY_VERSION}
      RECOVERY_CODE_HMAC_KEYS: ${RECOVERY_CODE_HMAC_KEYS}
      DB_DRIVER: ${DB_DRIVER}
      DB_FLAVOR: ${DB_FLAVOR}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_RUNTIME_USER}
      DB_PASSWORD: ${DB_RUNTIME_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE}
      INITIAL_LOCALES: ${INITIAL_LOCALES}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE}
      LOG_LEVEL: ${LOG_LEVEL}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.http.routers.go-lang-api.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN}`)
      - traefik.http.routers.go-lang-api.entrypoints=websecure
      - traefik.http.routers.go-lang-api.tls.certresolver=letsencrypt
      - traefik.http.routers.go-lang-api.middlewares=security-headers@file
      - traefik.http.services.go-lang-api.loadbalancer.server.port=8080
      - traefik.http.services.go-lang-api.loadbalancer.healthcheck.path=/readyz
      - traefik.http.services.go-lang-api.loadbalancer.healthcheck.interval=10s
    networks: [proxy, backend]

  api-migrate:
    image: ${MIGRATE_IMAGE:?set MIGRATE_IMAGE}
    restart: "no"
    user: "65532:65532"
    entrypoint: [/app/migrate]
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_TIMEZONE: ${APP_TIMEZONE}
      DB_DRIVER: ${DB_DRIVER}
      DB_FLAVOR: ${DB_FLAVOR}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_MIGRATION_USER}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE}
      INITIAL_LOCALES: ${INITIAL_LOCALES}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks: [backend]

networks:
  proxy:
    external: true
  backend:
    external: true
    name: backend
